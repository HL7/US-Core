  - url: http://hl7.org/fhir/StructureDefinition/instance-description
    valueMarkdown: This is an example portable chest radiograph study for the *US
      Core ImagingStudy Profile*. It contains only the mandatory and Must Support
      elements. It is identified by its accession number and is reachable through a
      DICOMweb WADO-RS endpoint. It carries no DICOM Study Instance UID, so a
      consumer queries for the study rather than retrieving the images directly.
      The *US Core DiagnosticReport Profile for Report and Note Exchange* chest
      xray report example references this study through `DiagnosticReport.imagingStudy`.
