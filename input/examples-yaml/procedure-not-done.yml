    valueString: Procedure Not Done Example
  - url: http://hl7.org/fhir/StructureDefinition/instance-description
    valueMarkdown: This is a not done example for the *US Core Procedure Profile*.
      It shows the USCDI *Reason Not Performed* Data Element, where `Procedure.status`
      is "not-done" and `Procedure.statusReason` records that the patient refused
      the procedure. `Procedure.performed[x]` is absent because no procedure took
      place, and the preadopted FHIR R5 `Procedure.recorded` element records when
      the refusal was captured in the patient's record.
