# US Core DeviceRequest Profile - FHIR StructureDefinition
# Notes:
#   * DeviceRequest.code[x]: a server choice of CodeableConcept or a Reference to the US Core Device
#     Profile. Both datatypes carry the Must Support extension, so the Server supports at least one
#     and the Client supports both, following MedicationRequest.reported[x]. The profile
#     introduction documents the choice.
#   * DeviceRequest.subject and DeviceRequest.requester: use the US Core Profiles for Patient,
#     Location, Device, Practitioner, PractitionerRole, and Organization.
#   * Use the Must Support extension ("http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support")
#     on the targetProfile elements to indicate the US Core Patient Profile is a Must Support
#     DeviceRequest.subject target and the US Core Practitioner Profile is a Must Support
#     DeviceRequest.requester target.

resourceType: StructureDefinition
id: us-core-devicerequest
#============= Update when version named in regs ====================
extension:
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-fmm
    valueInteger: 2
#======================================================================
url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-devicerequest
name: USCoreDeviceRequestProfile
title: US Core DeviceRequest Profile
status: active
experimental: false
date: '2026-10-18'
description: >-
  The US Core DeviceRequest Profile inherits from the FHIR
  [DeviceRequest](https://hl7.org/fhir/R4/devicerequest.html) resource; refer to
  it for scope and usage definitions. This profile meets the requirements of the
  U.S. Core Data for Interoperability (USCDI) *Medical Device Order Data Element
  of the Orders Data Class*. It sets minimum expectations for the DeviceRequest
  resource to record, search, and fetch orders for medical devices for a
  patient. It specifies which core elements, extensions, vocabularies, and value
  sets **SHALL** be present in the resource and constrains how the elements are
  used. Providing the floor for standards development for specific use cases
  promotes interoperability and adoption.
fhirVersion: 4.0.1
kind: resource
abstract: false
type: DeviceRequest
baseDefinition: http://hl7.org/fhir/StructureDefinition/DeviceRequest
derivation: constraint

differential:
  element:

    # ---- status -------------------------------------------------------------
    # Base cardinality is 0..1, so min 1 is a real constraint here.
    - id: DeviceRequest.status
      path: DeviceRequest.status
      min: 1
      max: '1'
      mustSupport: true
      binding:
        strength: required
        valueSet: http://hl7.org/fhir/ValueSet/request-status

    # ---- intent -------------------------------------------------------------
    - id: DeviceRequest.intent
      path: DeviceRequest.intent
      min: 1
      max: '1'
      mustSupport: true
      binding:
        strength: required
        valueSet: http://hl7.org/fhir/ValueSet/request-intent

    # ---- code[x] ------------------------------------------------------------
    # A server choice: both datatypes are Must Support, so the Server supports at
    # least one and the Client supports both. The binding is strengthened from the
    # base example to preferred; HCPCS was declined at the September 23 WGM.
    - id: DeviceRequest.code[x]
      path: DeviceRequest.code[x]
      min: 1
      max: '1'
      type:
        - extension:
            - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
              valueBoolean: true
          code: CodeableConcept
        - extension:
            - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
              valueBoolean: true
          code: Reference
          targetProfile:
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-device
      mustSupport: true
      binding:
        strength: preferred
        valueSet: http://hl7.org/fhir/ValueSet/device-kind

    # ---- subject ------------------------------------------------------------
    - id: DeviceRequest.subject
      path: DeviceRequest.subject
      min: 1
      max: '1'
      mustSupport: true
      type:
        - code: Reference
          targetProfile:
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-patient
            - http://hl7.org/fhir/StructureDefinition/Group
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-location
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-device
          _targetProfile:
            - extension:
                - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
                  valueBoolean: true
            - extension:
                - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
                  valueBoolean: false
            - extension:
                - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
                  valueBoolean: false
            - extension:
                - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
                  valueBoolean: false

    # ---- authoredOn ---------------------------------------------------------
    - id: DeviceRequest.authoredOn
      path: DeviceRequest.authoredOn
      min: 0
      max: '1'
      mustSupport: true

    # ---- requester ----------------------------------------------------------
    # Individual-level provenance for this profile; see the Basic Provenance page.
    - id: DeviceRequest.requester
      path: DeviceRequest.requester
      min: 0
      max: '1'
      mustSupport: true
      type:
        - code: Reference
          targetProfile:
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-practitioner
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-practitionerrole
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-organization
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-device
          _targetProfile:
            - extension:
                - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
                  valueBoolean: true
            - extension:
                - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
                  valueBoolean: false
            - extension:
                - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
                  valueBoolean: false
            - extension:
                - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
                  valueBoolean: false
