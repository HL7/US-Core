# US Core Patient Accommodation Profile - FHIR StructureDefinition
# Notes:
#   * The October 15 design call settled on a standalone Observation profile. The alternative,
#     reusing Simple Observation inside the Assessments framework, was mocked up and discarded as
#     confusing and as breaking the assessments pattern.
#   * Observation.category:us-core is patterned on the new "accommodation" code added to the
#     US Core Category code system. The binding is to US Core Simple Observation Category, which
#     includes the whole code system, so no value set change is needed. This mirrors the US Core
#     Care Experience Preference and Treatment Intervention Preference Profiles.
#   * Observation.code carries a PLACEHOLDER. The design call settled on a new prerelease LOINC
#     code for "Accommodation Need", which has not been issued yet, so 55555-5 stands in and is
#     labelled as a sham code. It must be replaced before publication, and it is the reason the
#     build reports an unknown-LOINC-code error.
#   * Observation.value[x] is a Must Support choice of CodeableConcept and string. PACIO and
#     Gravity are developing a strawman value set in VSAC, so there is no binding yet, and the
#     profile introduction records that the free-text option may be withdrawn as the code set
#     matures.
#   * Observation.performer is an Additional USCDI Requirement, not Must Support, and carries the
#     same six targets as the sibling preference profiles.

resourceType: StructureDefinition
id: us-core-patient-accommodation
#============= Update when version named in regs ====================
extension:
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-fmm
    valueInteger: 2
#======================================================================
url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-patient-accommodation
name: USCorePatientAccommodationProfile
title: US Core Patient Accommodation Profile
status: active
experimental: false
date: '2026-10-19'
description: >-
  The US Core Patient Accommodation Profile inherits from the FHIR
  [Observation](https://hl7.org/fhir/R4/observation.html) resource; refer to it
  for scope and usage definitions. This profile meets the requirements of the
  U.S. Core Data for Interoperability (USCDI) *Accommodation Data Element of the
  Patient Demographics/Information Data Class*. It sets minimum expectations for
  the Observation resource to record, search, and fetch the supports and services
  necessary for a patient to access care, including modifications, tools, and
  technologies. Examples include, but are not limited to, sign language
  interpreters, wheelchair accessibility requirements, and sensory accommodation.
  It specifies which core elements, extensions, vocabularies, and value sets
  **SHALL** be present in the resource and constrains how the elements are used.
  Providing the floor for standards development for specific use cases promotes
  interoperability and adoption.
fhirVersion: 4.0.1
kind: resource
abstract: false
type: Observation
baseDefinition: http://hl7.org/fhir/StructureDefinition/Observation
derivation: constraint
differential:
  element:
    - id: Observation
      path: Observation

    - id: Observation.status
      path: Observation.status
      mustSupport: true

    # ---- category -----------------------------------------------------------
    - id: Observation.category
      path: Observation.category
      slicing:
        discriminator:
          - type: value
            path: $this
        rules: open
      mustSupport: true
      binding:
        strength: preferred
        description: FHIR and US Core codes for high level observation categories.
        valueSet: http://hl7.org/fhir/us/core/ValueSet/us-core-simple-observation-category

    - id: Observation.category:us-core
      path: Observation.category
      sliceName: us-core
      min: 0
      max: '1'
      patternCodeableConcept:
        coding:
          - system: http://hl7.org/fhir/us/core/CodeSystem/us-core-category
            code: accommodation
      mustSupport: true
      binding:
        strength: preferred
        description: FHIR and US Core codes for high level observation categories.
        valueSet: http://hl7.org/fhir/us/core/ValueSet/us-core-simple-observation-category

    # ---- code ---------------------------------------------------------------
    #=== PLACEHOLDER: replace 55555-5 with the prerelease LOINC code for
    #=== "Accommodation Need" before publication. See the profile introduction.
    - id: Observation.code
      path: Observation.code
      short: Patient accommodation code (SHAM CODE)
      patternCodeableConcept:
        coding:
          - system: http://loinc.org
            code: 55555-5
      mustSupport: true
    #======================================================================

    - id: Observation.subject
      path: Observation.subject
      min: 1
      type:
        - code: Reference
          targetProfile:
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-patient
      mustSupport: true

    - id: Observation.effective[x]
      path: Observation.effective[x]
      definition: The time or time-period the observed value is asserted as being true.
      type:
        - extension:
            - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
              valueBoolean: true
          code: dateTime
        - code: Period
        - code: Timing
        - code: instant
      mustSupport: true

    # ---- performer ----------------------------------------------------------
    #===================  new for USCDI 7====================================
    - id: Observation.performer
      path: Observation.performer
      extension:
        - url: http://hl7.org/fhir/us/core/StructureDefinition/uscdi-requirement
          valueBoolean: true
      short: "\U0001D5D4\U0001D5D7\U0001D5D7\U0001D5DC\U0001D5E7\U0001D5DC\U0001D5E2\U0001D5E1\U0001D5D4\U0001D5DF \U0001D5E8\U0001D5E6\U0001D5D6\U0001D5D7\U0001D5DC: Who is responsible for the observation"
      type:
        - code: Reference
          targetProfile:
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-practitioner
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-organization
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-patient
            - http://hl7.org/fhir/StructureDefinition/PractitionerRole
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-careteam
            - http://hl7.org/fhir/us/core/StructureDefinition/us-core-relatedperson
    #===================  new for USCDI 7====================================

    # ---- value[x] -----------------------------------------------------------
    # Must Support choice of CodeableConcept and string, per the October 15 call.
    # No binding yet: the PACIO/Gravity strawman value set is pending in VSAC.
    - id: Observation.value[x]
      path: Observation.value[x]
      type:
        - extension:
            - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
              valueBoolean: true
          code: CodeableConcept
        - extension:
            - url: http://hl7.org/fhir/StructureDefinition/elementdefinition-type-must-support
              valueBoolean: true
          code: string
        - code: Quantity
        - code: boolean
        - code: integer
        - code: Range
        - code: Ratio
        - code: SampledData
        - code: time
        - code: dateTime
        - code: Period
      mustSupport: true
