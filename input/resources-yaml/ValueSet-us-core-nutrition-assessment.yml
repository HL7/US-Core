resourceType: ValueSet
id: us-core-nutrition-assessment
url: http://hl7.org/fhir/us/core/ValueSet/us-core-nutrition-assessment
name: USCoreNutritionAssessment
title: US Core Nutrition Assessment
status: active
experimental: false
date: 2026-10-16
description: >-
  This value set is a 'starter set' of LOINC panel and panel item codes for the
  USCDI Nutrition Assessment data element. It is the set of panel items of the
  LOINC Nutrition assessment panel (75282-4), which LOINC created for the
  Nutrition Section of the HL7 Implementation Guide for CDA Release 2:
  Consolidated CDA Templates for Clinical Notes. The codes are used in the US
  Core Observation Screening Assessment Profile and the SDC Base
  Questionnaire/US Core QuestionnaireResponse Profile to record the questions
  and responses of a structured nutrition assessment.
